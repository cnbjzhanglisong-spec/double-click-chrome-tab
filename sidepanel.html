<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双击关标签</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" />
              <path d="M3 8.5h18" stroke="currentColor" stroke-width="1.8" />
              <path d="m9 12 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <div>
            <p class="eyebrow">DOUBLE-CLICK</p>
            <h1>双击关标签</h1>
          </div>
        </div>

        <button class="icon-button" id="refreshButton" type="button" title="刷新标签列表" aria-label="刷新标签列表">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.34 5.66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M20 5v6h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <p class="intro">单击切换标签，<strong>双击关闭标签</strong>。</p>

      <section class="search-area" aria-label="搜索标签页">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.8" />
            <path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input id="searchInput" type="search" placeholder="搜索标签页" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </label>
      </section>

      <div class="list-meta">
        <span id="tabCount">正在读取标签页…</span>
        <span class="double-click-tip">双击即关闭</span>
      </div>

      <section class="tab-list" id="tabList" aria-label="打开的标签页">
        <div class="loading-state">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </div>
      </section>

      <footer class="footer">
        <label class="setting-row" for="pageDoubleClick">
          <span class="setting-copy">
            <strong>网页空白处双击关闭</strong>
            <small>双击网页背景或布局空白处可关闭当前标签，文字和交互控件不受影响。</small>
          </span>
          <input id="pageDoubleClick" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="position-card" id="sidePositionCard" hidden>
          <span class="position-copy">
            <strong id="sidePositionTitle">侧栏位置</strong>
            <small id="sidePositionText">Chrome 的侧栏位置需要在浏览器设置中调整。</small>
          </span>
          <button class="text-button" id="openAppearanceSettings" type="button">去设置</button>
        </div>

        <p class="compatibility-note">
          Chrome 不允许扩展监听原生标签栏上的鼠标双击，请使用上方标签列表或网页空白处双击。
        </p>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
